services:
  - type: web
    name: seb-gun-crm
    runtime: node
    plan: free

    buildCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm install --omit=dev && npm run check
    startCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_LOCAL_PHRASE_FALLBACK
        value: "1"
      - key: API_TIMEOUT_MS
        value: "18000"
      - key: BS_QUEUE_MAX_WAIT_MS
        value: "10000"
      - key: BS_ORG_BUSY_RETRIES
        value: "1"
      - key: PUBLIC_BASE_URL
        value: "https://seb-gun-crm.onrender.com"
      - key: VK_DIRECT_AUTHOR
        value: "Дарья А."
      - key: LOCAL_STT_ENABLED
        value: "1"
      - key: LOCAL_STT_MODEL
        value: "Xenova/whisper-tiny"
      - key: LOCAL_STT_DTYPE
        value: "q8"
      - key: LOCAL_STT_LANGUAGE
        value: "russian"
      - key: LOCAL_STT_TIMEOUT_MS
        value: "90000"
      - key: VOICE_TRANSCRIPT_TTL_MS
        value: "7776000000"
      - key: VK_TOKEN
        sync: false
      - key: VK_COMMUNITY
        sync: false
      - key: VK_COMMUNITY_URL
        sync: false
