services:
  - type: web
    name: seb-gun-crm
    runtime: node
    plan: free

    buildCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm install && npm run build && npm run check:runtime && npm run test:v280
    startCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_LOCAL_PHRASE_FALLBACK
        value: "1"
      - key: API_TIMEOUT_MS
        value: "18000"
      - key: BS_QUEUE_MAX_WAIT_MS
        value: "10000"
      - key: BS_ORG_BUSY_RETRIES
        value: "1"
      - key: PUBLIC_BASE_URL
        value: "https://seb-gun-crm.onrender.com"
      - key: VK_DIRECT_AUTHOR
        value: "Дарья А."

      # v28.0 async STT: quick SpeechRecognition-compatible Google backend.
      # It does not use VK transcript. The request returns immediately and the UI polls a background job.
      # The generic key behavior follows the open-source Uberi/SpeechRecognition implementation and is best-effort/testing-grade.
      - key: STT_ENABLED
        value: "1"
      - key: STT_PROVIDER
        value: "google-legacy"
      - key: STT_PROVIDER_TIMEOUT_MS
        value: "45000"
      - key: STT_LOCAL_FALLBACK
        value: "0"
      - key: STT_LANGUAGE
        value: "russian"
      - key: STT_MODEL
        value: "onnx-community/whisper-tiny"
      - key: STT_DTYPE
        value: "q8"
      - key: STT_TIMEOUT_MS
        value: "300000"
      - key: STT_IDLE_RELEASE_MS
        value: "300000"
      - key: VOICE_TRANSCRIPT_TTL_MS
        value: "7776000000"

      # v28.0 Telegram SLA notifications. Secrets are entered only in Render Environment.
      - key: TELEGRAM_BOT_USERNAME
        value: "yozhiki_sebastian_bot"
      - key: NOTIFICATION_TIMEZONE
        value: "Europe/Moscow"
      - key: APP_TIMEZONE
        value: "Europe/Moscow"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: NOTIFICATION_CHECK_SECRET
        sync: false
      - key: BLUESALES_NOTIFICATION_LOGIN
        sync: false
      - key: BLUESALES_NOTIFICATION_PASSWORD
        sync: false

      - key: VK_TOKEN
        sync: false
      - key: VK_COMMUNITY
        sync: false
      - key: VK_COMMUNITY_URL
        sync: false
