services:
  - type: web
    name: seb-gun-crm
    runtime: node
    plan: free

    buildCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm install --omit=dev && npm run check
    startCommand: cd seb_gun_crm_render_ready/seb_gun_crm_render_ready && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_LOCAL_PHRASE_FALLBACK
        value: "1"
      - key: API_TIMEOUT_MS
        value: "18000"
      - key: BS_QUEUE_MAX_WAIT_MS
        value: "10000"
      - key: BS_ORG_BUSY_RETRIES
        value: "1"
      - key: PUBLIC_BASE_URL
        value: "https://seb-gun-crm.onrender.com"
      - key: VK_DIRECT_AUTHOR
        value: "Дарья А."

      # Independent open-source speech-to-text. Audio is converted with the bundled
      # ffmpeg-static binary and recognized by Transformers.js Whisper in a worker.
      # No VK transcript API and no external STT API key is used.
      - key: STT_ENABLED
        value: "1"
      - key: STT_LANGUAGE
        value: "russian"
      - key: STT_MODEL
        value: "onnx-community/whisper-tiny"
      - key: STT_DTYPE
        value: "q8"
      - key: STT_TIMEOUT_MS
        value: "300000"
      - key: STT_IDLE_RELEASE_MS
        value: "300000"
      - key: VOICE_TRANSCRIPT_TTL_MS
        value: "7776000000"

      - key: VK_TOKEN
        sync: false
      - key: VK_COMMUNITY
        sync: false
      - key: VK_COMMUNITY_URL
        sync: false
