<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#151b17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="seb_gun CRM — VK Messenger + BlueSales" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>seb_gun CRM</title>
</head>
<body><div id="app"></div>
  <script>
    // v28 deliberately removes the old hand-written Service Worker. Clear legacy registrations/caches once.
    Promise.resolve().then(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.startsWith('seb-gun-')||k.startsWith('bluesales-'))await caches.delete(k)}}catch(e){console.warn('[v28 cache cleanup]',e)}})
  </script>
  <script type="module" src="/src/main.js"></script></body>
</html>
