services:
  - type: web
    name: seb-gun-crm
    runtime: node
    plan: free

    buildCommand: cd seb_gun_crm_render_ready && npm ci --include=dev && npm run build && npm run check:runtime && npm run test:v283 && npm run test:v284 && npm run test:v285 && npm run test:v286 && npm run test:v287 && npm run test:v288 && npm run test:v289 && npm run test:v2810 && npm run test:v2811 && npm run test:v2812 && npm run test:v2813 && npm run test:v2814 && npm run test:v2815 && npm run test:database
    startCommand: cd seb_gun_crm_render_ready && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_LOCAL_PHRASE_FALLBACK
        value: "1"
      - key: API_TIMEOUT_MS
        value: "18000"
      - key: BS_QUEUE_MAX_WAIT_MS
        value: "10000"
      - key: BS_ORG_BUSY_RETRIES
        value: "1"
      - key: PUBLIC_BASE_URL
        value: "https://seb-gun-crm.onrender.com"
      - key: VK_DIRECT_AUTHOR
        value: "Дарья А."

      # v28.0 async STT: quick SpeechRecognition-compatible Google backend.
      # It does not use VK transcript. The request returns immediately and the UI polls a background job.
      # The generic key behavior follows the open-source Uberi/SpeechRecognition implementation and is best-effort/testing-grade.
      - key: STT_ENABLED
        value: "1"
      - key: STT_PROVIDER
        value: "google-legacy"
      - key: STT_PROVIDER_TIMEOUT_MS
        value: "45000"
      - key: STT_LOCAL_FALLBACK
        value: "0"
      - key: STT_LANGUAGE
        value: "russian"
      - key: STT_MODEL
        value: "onnx-community/whisper-tiny"
      - key: STT_DTYPE
        value: "q8"
      - key: STT_TIMEOUT_MS
        value: "300000"
      - key: STT_IDLE_RELEASE_MS
        value: "300000"
      - key: VOICE_TRANSCRIPT_TTL_MS
        value: "7776000000"

      # v28.0 Telegram SLA notifications. Secrets are entered only in Render Environment.
      - key: TELEGRAM_BOT_USERNAME
        value: "yozhiki_sebastian_bot"
      - key: NOTIFICATION_TIMEZONE
        value: "Europe/Moscow"
      - key: APP_TIMEZONE
        value: "Europe/Moscow"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: NOTIFICATION_CHECK_SECRET
        sync: false
      - key: BLUESALES_NOTIFICATION_LOGIN
        sync: false
      - key: BLUESALES_NOTIFICATION_PASSWORD
        sync: false
      # v28.10: all per-manager Telegram chat IDs and individual filters in one JSON array.
      - key: NOTIFICATION_RULES_JSON
        sync: false
      # Legacy one-manager fallback; optional when NOTIFICATION_RULES_JSON is configured.
      - key: NOTIFICATION_DEFAULT_CHAT_ID
        sync: false
      - key: NOTIFICATION_DEFAULT_MANAGER
        sync: false
      - key: NOTIFICATION_DEFAULT_MANAGER_FILTERS
        sync: false
      - key: NOTIFICATION_DEFAULT_STATUSES
        sync: false
      - key: NOTIFICATION_DEFAULT_SLA_MINUTES
        value: "8"
      - key: NOTIFICATION_DEFAULT_WORK_START
        value: "10:00"
      - key: NOTIFICATION_DEFAULT_WORK_END
        value: "22:00"

      - key: VK_TOKEN
        sync: false
      - key: VK_COMMUNITY
        sync: false
      - key: VK_COMMUNITY_URL
        sync: false

      # PostgreSQL secrets: enter in Render Environment.
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE
        value: "1"
      - key: SESSION_SECRET
        sync: false
      - key: DB_IMPORT_ON_START
        value: "0"
